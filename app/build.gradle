plugins {
    id 'com.android.application'
}

def possibleJniDirs = ['../libs', '../lib', '../jniLibs', 'libs', 'lib', 'jniLibs']
    .collect { file(it) }
    .findAll { it.isDirectory() }
    .unique()
def libjarsDir = file('../libjars')

if (possibleJniDirs.isEmpty()) {
    logger.lifecycle('No JNI libs directory found. Native libraries such as libnativename.so must be present under libs/<abi>, lib/<abi>, or jniLibs/<abi> before packaging.')
}

android {
    namespace 'com.topodroid.TDX'
    compileSdk 36

    defaultConfig {
        applicationId 'com.topodroid.TDX'
        minSdk 21
        targetSdk 36
        versionCode 604027
        versionName '6.4.27'
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../proguard.cfg'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
            if (!possibleJniDirs.isEmpty()) {
                jniLibs.srcDirs = possibleJniDirs
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    testOptions {
        animationsDisabled true
    }
}

dependencies {
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'com.google.guava:guava:33.0.0-android'

    if (libjarsDir.isDirectory()) {
        implementation fileTree(dir: libjarsDir, include: ['*.jar'])
    }

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
