plugins {
    id 'com.android.application'
}

def possibleJniDirs = ['../libs', '../lib', '../jniLibs', 'libs', 'lib', 'jniLibs']
    .collect { file(it) }
    .findAll { it.isDirectory() }
    .unique()
def libjarsDir = file('../libjars')

def requiredStringProperty = { String name ->
    def value = providers.gradleProperty(name).getOrNull()
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("Missing required Gradle property '${name}'")
    }
    return value.trim()
}

def requiredIntProperty = { String name ->
    def value = requiredStringProperty(name)
    try {
        return Integer.parseInt(value)
    } catch (NumberFormatException ignored) {
        throw new GradleException("Gradle property '${name}' must be an integer, got '${value}'")
    }
}

def sketchVersionMajor = requiredIntProperty('SKETCH_VERSION_MAJOR')
def sketchVersionMinor = requiredIntProperty('SKETCH_VERSION_MINOR')
def sketchVersionPatch = requiredIntProperty('SKETCH_VERSION_PATCH')
def sketchVersionCodeEpoch = requiredIntProperty('SKETCH_VERSION_CODE_EPOCH')
def topodroidCompatVersionName = requiredStringProperty('TOPODROID_COMPAT_VERSION_NAME')
def topodroidCompatVersionCode = requiredIntProperty('TOPODROID_COMPAT_VERSION_CODE')

if (sketchVersionMajor < 0 || sketchVersionMinor < 0 || sketchVersionMinor > 99 || sketchVersionPatch < 0 || sketchVersionPatch > 99 || sketchVersionCodeEpoch < 0) {
    throw new GradleException('Sketch version parts must be non-negative; minor and patch must be 0..99')
}

def sketchVersionName = "${sketchVersionMajor}.${sketchVersionMinor}.${sketchVersionPatch}"
def sketchVersionCode = (sketchVersionCodeEpoch + sketchVersionMajor) * 100000 + sketchVersionMinor * 1000 + sketchVersionPatch * 10

def shortGitSha = {
    def gitPath = rootProject.file('.git')
    if (gitPath.isFile()) {
        def marker = gitPath.text.trim()
        if (marker.startsWith('gitdir:')) {
            gitPath = rootProject.file(marker.substring('gitdir:'.length()).trim())
        }
    }
    def head = new File(gitPath, 'HEAD')
    if (!head.isFile()) return 'nogit'

    def value = head.text.trim()
    if (value.startsWith('ref:')) {
        def ref = value.substring('ref:'.length()).trim()
        def refFile = new File(gitPath, ref)
        if (refFile.isFile()) {
            value = refFile.text.trim()
        } else {
            def packedRefs = new File(gitPath, 'packed-refs')
            if (packedRefs.isFile()) {
                def match = packedRefs.readLines().find { line ->
                    !line.startsWith('#') && line.endsWith(" ${ref}")
                }
                value = match == null ? '' : match.split(' ')[0]
            }
        }
    }
    return value.length() >= 9 ? value.substring(0, 9) : 'nogit'
}

if (possibleJniDirs.isEmpty()) {
    logger.lifecycle('No JNI libs directory found. Native libraries such as libnativename.so must be present under libs/<abi>, lib/<abi>, or jniLibs/<abi> before packaging.')
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

base {
    archivesName = "TopoDroidSketch-${sketchVersionName}"
}

android {
    namespace 'com.topodroid.TDX'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.topodroid.TDX.sketch'
        testApplicationId 'com.topodroid.TDX.sketch.test'
        minSdk 21
        targetSdk 36
        versionCode sketchVersionCode
        versionName sketchVersionName
        buildConfigField 'String', 'TOPODROID_COMPAT_VERSION_NAME', "\"${topodroidCompatVersionName}\""
        buildConfigField 'int', 'TOPODROID_COMPAT_VERSION_CODE', "${topodroidCompatVersionCode}"
        multiDexEnabled true
        testInstrumentationRunner 'com.topodroid.TDX.qa.SketchTestRunner'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../proguard.cfg'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        test { java.srcDir 'src/qa/java' }
        androidTest { java.srcDir 'src/qa/java' }
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
            if (!possibleJniDirs.isEmpty()) {
                jniLibs.srcDirs = possibleJniDirs
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    testOptions {
        animationsDisabled true
    }

    lint {
        // Translations (res/values-bg, -cn, -de, -es, -hu, -it, -pt, -ru) lag behind
        // strings added by the fork and retain entries removed from the default locale.
        // These checks otherwise prevent lintVitalRelease from packaging a release.
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

dependencies {
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'com.google.guava:guava:33.0.0-android'

    testImplementation 'junit:junit:4.13.2'

    if (libjarsDir.isDirectory()) {
        implementation fileTree(dir: libjarsDir, include: ['*.jar'])
    }

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

tasks.register('packageQaDebug', Copy) {
    dependsOn 'assembleDebug'
    outputs.upToDateWhen { false }
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(rootProject.layout.projectDirectory.dir('dist'))
    rename { String filename ->
        "TopoDroid-Sketch-v${sketchVersionName}-${sketchVersionCode}-${shortGitSha()}-debug.apk"
    }
}

// The full/default JVM run includes calibration. The quick command excludes only
// explicitly categorized simulations, and always reruns the test task itself.
tasks.withType(Test).configureEach {
    if (providers.gradleProperty('qaFast').isPresent()) {
        useJUnit { excludeCategories 'com.topodroid.qa.SlowChecks' }
    }
    outputs.upToDateWhen { false }
    onlyIf {
        def inventory = []
        def requestedFeatures = providers.gradleProperty('qaFeatures').orElse('').get().split(',').findAll { it }.toSet()
        def loader = new URLClassLoader(classpath.files.collect { it.toURI().toURL() } as URL[], (ClassLoader)null)
        try {
            def validFeatures = Class.forName('com.topodroid.qa.TestFeatures$Feature', false, loader).enumConstants.collect { it.name().toLowerCase(Locale.ROOT) }.toSet()
            if (!validFeatures.containsAll(requestedFeatures)) throw new GradleException('Unknown JVM feature selection: ' + requestedFeatures)
            testClassesDirs.files.each { directory ->
                if (directory.exists()) directory.eachFileRecurse { candidate ->
                    if (candidate.name.endsWith('.class') && !candidate.name.contains('$')) {
                        def name = directory.toPath().relativize(candidate.toPath()).toString().replace(File.separator, '.').replaceAll(/\.class$/, '')
                        def type = Class.forName(name, false, loader)
                        def slow = type.annotations.any { annotation ->
                            annotation.annotationType().name == 'org.junit.experimental.categories.Category' &&
                                annotation.value().any { it.name == 'com.topodroid.qa.SlowChecks' }
                        }
                        type.declaredMethods.findAll { method -> method.annotations.any { it.annotationType().name == 'org.junit.Test' } }.each { method ->
                            def features = method.annotations.find { it.annotationType().name == 'com.topodroid.qa.TestFeatures' } ?:
                                type.annotations.find { it.annotationType().name == 'com.topodroid.qa.TestFeatures' }
                            if (features == null || features.value().length == 0) throw new GradleException('JVM test missing feature classification: ' + name + '#' + method.name)
                            def names = features.value().collect { it.name().toLowerCase(Locale.ROOT) }.sort()
                            if (names.toSet().size() != names.size()) throw new GradleException('Duplicate JVM feature: ' + name + '#' + method.name)
                            def requested = (requestedFeatures.empty || names.any { requestedFeatures.contains(it) }) &&
                                !(slow && providers.gradleProperty('qaFast').isPresent())
                            inventory.add([id: 'jvm:' + name + '#' + method.name, tier: slow ? 'CALIBRATION' : 'JVM', features: names,
                                requested: requested, status: 'NOT_REQUESTED', seconds: 0, note: ''])
                        }
                    }
                }
            }
        } finally { loader.close() }
        if (inventory.empty) throw new GradleException('JVM discovery returned zero tests')
        def output = layout.buildDirectory.file('qa/jvm-inventory.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(inventory))
        def selected = inventory.findAll { it.requested }
        if (!requestedFeatures.empty && !selected.empty) {
            filter.setIncludePatterns(selected.collect { it.id.substring(4).replace('#', '.') } as String[])
        }
        if (selected.empty) logger.lifecycle('No JVM methods requested for these features; Android selection is accounted separately.')
        return !selected.empty
    }
}
